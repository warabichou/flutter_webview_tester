name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Use CocoaPods for iOS plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          cp -a build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r -y WebViewTester-unsigned.ipa Payload
          unzip -t WebViewTester-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebViewTester-unsigned
          path: build/ios/ipa/WebViewTester-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
